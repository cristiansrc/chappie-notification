[project]
name = "chappie-notification"
version = "0.1.0"
description = "Chappie Notification Daemon - Event processing center for the Chappie ecosystem"
requires-python = ">=3.12"
authors = [
    {name = "Chappie Team"},
]
dependencies = [
    "aio-pika>=9.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "edge-tts>=6.0.0",
    "dbus-next>=0.2.3",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest-httpx>=0.30.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chappie_notification*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/chappie_notification/application/dto/*",
    "src/chappie_notification/infrastructure/config/app_config.py",
    "src/chappie_notification/domain/exceptions/*",
    "src/chappie_notification/__init__.py",
    "src/chappie_notification/domain/__init__.py",
    "src/chappie_notification/application/__init__.py",
    "src/chappie_notification/infrastructure/__init__.py",
    "src/chappie_notification/main.py",
    "src/chappie_notification/infrastructure/config/container.py",
    "src/chappie_notification/infrastructure/consumers/*",
    "src/chappie_notification/infrastructure/adapters/rabbitmq_publisher_adapter.py",
    "src/chappie_notification/infrastructure/adapters/edge_tts_adapter.py",
    "src/chappie_notification/infrastructure/adapters/opencode_agent_adapter.py",
    "src/chappie_notification/infrastructure/adapters/subprocess_command_adapter.py",
    "src/chappie_notification/infrastructure/adapters/swaync_notification_adapter.py",
    "src/chappie_notification/infrastructure/adapters/httpx_client_adapter.py",
    "src/chappie_notification/application/ports/*",
    "**/__init__.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
